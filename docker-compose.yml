services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - 3000:3000
    networks:
      - app_network
    environment:
      - NODE_ENV=production
      - PORT=3000

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: /api
    container_name: frontend
    ports:
      - "80:80" 
    networks:
      - app_network

networks:
  app_network:
    driver: bridge